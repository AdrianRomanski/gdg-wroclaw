@let k = keynote();
<div class="card">
  <ul class="labels">
    @if (k.time) {
    <li>
      <gdg-tag
        ><time [attr.datetime]="k.dateTime ?? null">{{ k.time }}</time></gdg-tag
      >
    </li>
    } @if (typeLabel()) {
    <li><gdg-tag>{{ typeLabel() }}</gdg-tag></li>
    } @if (k.room) {
    <li><gdg-tag>{{ k.room }}</gdg-tag></li>
    }
  </ul>
  <h3 class="title">{{ k.title }}</h3>
  @if (k.abstract) {
  <p class="abstract">{{ k.abstract }}</p>
  } @if (k.speaker) {
  <p class="speaker">
    <gdg-avatar size="m" [initials]="speakerInitials()" />
    <span>{{ k.speaker.name }}</span>
  </p>
  }
</div>
