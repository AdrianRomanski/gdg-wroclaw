@let k = keynote();
<div class="card">
  <ul class="labels">
    @if (k.time) {
    <li>
      <gdg-tag
        ><time [attr.datetime]="k.dateTime ?? null">{{ k.time }}</time></gdg-tag
      >
    </li>
    } @if (typeLabel()) {
    <li><gdg-tag>{{ typeLabel() }}</gdg-tag></li>
    } @if (label()) {
    <li><gdg-tag [accent]="accent()">{{ label() }}</gdg-tag></li>
    } @if (k.room) {
    <li><gdg-tag>{{ k.room }}</gdg-tag></li>
    }
  </ul>
  <h3 class="title">{{ k.title }}</h3>
  @if (k.abstract) {
  <p class="abstract">{{ k.abstract }}</p>
  } @if (k.speaker) {
  <div class="speaker">
    <div class="photo">
      <gdg-avatar
        size="xl"
        shape="square"
        [initials]="speakerInitials()"
        [src]="k.speaker.photo"
      />
    </div>
    <div class="who">
      <span class="name">{{ k.speaker.name }}</span>
      <gdg-person-bio [person]="k.speaker" onBrand />
    </div>
  </div>
  }
</div>
